<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | WEBFIXX STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070d;--glass:rgba(255,255,255,0.05);--border:rgba(255,255,255,0.1);--cyan:#4cc9f0;--violet:#9d4edd;--text:#f2f4f8;--muted:#8b93a7;--font-display:'Space Grotesk',sans-serif;--font-body:'Inter',sans-serif;--font-mono:'JetBrains Mono',monospace;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;}
.bg-orb{position:fixed;border-radius:50%;filter:blur(130px);opacity:0.3;pointer-events:none;}
.orb1{width:500px;height:500px;background:var(--cyan);top:-150px;left:-150px;}
.orb2{width:500px;height:500px;background:var(--violet);bottom:-150px;right:-150px;}
.login-card{position:relative;z-index:2;width:100%;max-width:380px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:22px;padding:40px 32px;backdrop-filter:blur(20px);box-shadow:0 40px 100px rgba(0,0,0,0.5);}
.logo{font-family:var(--font-display);font-weight:700;font-size:20px;text-align:center;margin-bottom:6px;}
.logo span{color:var(--cyan);}
.sub{text-align:center;color:var(--muted);font-size:13px;font-family:var(--font-mono);margin-bottom:30px;}
.form-group{margin-bottom:18px;}
.form-group label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:8px;font-family:var(--font-mono);}
.form-group input{width:100%;padding:13px 16px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text);font-size:14px;}
.form-group input:focus{outline:none;border-color:var(--cyan);}
.login-btn{width:100%;padding:14px;border-radius:999px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#04050a;font-weight:700;font-size:14.5px;margin-top:8px;}
.error-msg{color:#ff6b6b;font-size:12.5px;text-align:center;margin-top:14px;display:none;}
</style>
</head>
<body>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>
<div class="login-card">
  <div class="logo">WEBFIXX<span>.</span>ADMIN</div>
  <div class="sub">STUDIO CONTROL PANEL</div>
  <form id="loginForm">
    <div class="form-group"><label>Username</label><input type="text" id="username" required></div>
    <div class="form-group"><label>Password</label><input type="password" id="password" required></div>
    <button type="submit" class="login-btn">Log In</button>
    <p class="error-msg" id="errorMsg">Invalid username or password.</p>
  </form>
</div>
<script>
const form = document.getElementById('loginForm');
const errorMsg = document.getElementById('errorMsg');
form.addEventListener('submit', (e) => {
  e.preventDefault();
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  // TEMP credentials — change before real use, replace with Supabase Auth later
  if (u === 'admin' && p === 'webfixx2026') {
    sessionStorage.setItem('wfx_admin_logged_in', 'true');
    window.location.href = 'admin-dashboard.html';
  } else {
    errorMsg.style.display = 'block';
  }
});
</script>
</body>
</html>
