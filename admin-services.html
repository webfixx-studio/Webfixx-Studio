<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Services | WEBFIXX ADMIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
:root{--bg:#05070d;--glass:rgba(255,255,255,0.045);--glass-strong:rgba(255,255,255,0.08);--border:rgba(255,255,255,0.09);--cyan:#4cc9f0;--violet:#9d4edd;--text:#f2f4f8;--muted:#8b93a7;--font-display:'Space Grotesk',sans-serif;--font-body:'Inter',sans-serif;--font-mono:'JetBrains Mono',monospace;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;display:flex;}
a{text-decoration:none;color:inherit;}
.sidebar{width:220px;flex-shrink:0;background:rgba(255,255,255,0.03);border-right:1px solid var(--border);padding:24px 16px;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;}
.sidebar-logo{font-family:var(--font-display);font-weight:700;font-size:17px;margin-bottom:30px;padding:0 8px;}
.sidebar-logo span{color:var(--cyan);}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;font-size:13.5px;color:var(--muted);margin-bottom:4px;transition:0.2s;}
.nav-item:hover{background:rgba(255,255,255,0.04);color:var(--text);}
.nav-item.active{background:linear-gradient(135deg,rgba(76,201,240,0.15),rgba(157,78,221,0.15));color:var(--cyan);border:1px solid rgba(76,201,240,0.25);}
.logout-btn{margin-top:20px;padding:12px 14px;border-radius:10px;font-size:13px;color:#ff8787;cursor:pointer;border:1px solid rgba(255,107,107,0.2);text-align:center;}
.main{margin-left:220px;flex:1;padding:32px 36px;max-width:1000px;}
.page-title{font-family:var(--font-display);font-size:24px;margin-bottom:4px;}
.page-sub{color:var(--muted);font-size:13.5px;margin-bottom:26px;font-family:var(--font-mono);}
.loading{color:var(--muted);font-size:13px;text-align:center;padding:40px;}
.service-item{background:var(--glass);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:16px;}
.service-item-head{display:flex;align-items:center;gap:14px;margin-bottom:16px;cursor:pointer;}
.service-icon-box{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,rgba(76,201,240,0.2),rgba(157,78,221,0.2));display:flex;align-items:center;justify-content:center;font-size:18px;}
.service-item-head h4{font-family:var(--font-display);font-size:15px;flex:1;}
.chevron{color:var(--cyan);transition:0.3s;}
.service-item.open .chevron{transform:rotate(90deg);}
.service-body{display:none;}
.service-item.open .service-body{display:block;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-family:var(--font-mono);}
.form-group input,.form-group textarea{width:100%;padding:11px 14px;border-radius:9px;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text);font-size:13.5px;}
.form-group input:focus,.form-group textarea:focus{outline:none;border-color:var(--cyan);}
.save-btn{padding:10px 22px;border-radius:999px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--cyan),var(--violet));color:#04050a;font-weight:600;font-size:13px;}
.saved-msg{font-size:12px;color:var(--cyan);margin-left:10px;display:none;}
@media(max-width:800px){.sidebar{width:70px;padding:20px 8px;}.sidebar-logo{display:none;}.nav-item span.label{display:none;}.main{margin-left:70px;padding:24px 18px;}}
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-logo">WEBFIXX<span>.</span>ADMIN</div>
  <a href="admin-dashboard.html" class="nav-item">🏠 <span class="label">Dashboard</span></a>
  <a href="admin-services.html" class="nav-item active">🛠️ <span class="label">Services</span></a>
  <a href="admin-portfolio.html" class="nav-item">🖼️ <span class="label">Portfolio</span></a>
  <a href="admin-messages.html" class="nav-item">✉️ <span class="label">Messages</span></a>
  <a href="admin-settings.html" class="nav-item">⚙️ <span class="label">Settings</span></a>
  <div class="logout-btn" id="logoutBtn">Log Out</div>
</div>
<div class="main">
  <div class="page-title">Services</div>
  <div class="page-sub">Edit content shown on the Services section and pages</div>
  <div id="servicesList"><div class="loading">Loading...</div></div>
</div>
<script>
async function checkAuth() {
  const { data } = await supabaseClient.auth.getSession();
  if (!data.session) window.location.href = 'admin.html';
}
checkAuth();
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await supabaseClient.auth.signOut();
  window.location.href = 'admin.html';
});

const defaultServices = [
  {slug:'web-development', icon:'🌐', title:'Web Development', description:'Fast, responsive websites built with clean, modern code.', sort_order:1},
  {slug:'business-websites', icon:'🏢', title:'Business Websites', description:'Professional websites that represent your brand with credibility.', sort_order:2},
  {slug:'landing-pages', icon:'🚀', title:'Landing Pages', description:'High-converting pages built to turn visitors into leads.', sort_order:3},
  {slug:'ui-ux-design', icon:'🎨', title:'UI/UX Design', description:'Clean, modern interfaces designed around real user behaviour.', sort_order:4},
  {slug:'website-redesign', icon:'🔄', title:'Website Redesign', description:'Turning outdated websites into modern, high-performing ones.', sort_order:5},
  {slug:'custom-solutions', icon:'⚙️', title:'Custom Solutions', description:'Tailored digital solutions built around your exact requirements.', sort_order:6}
];

async function loadServices() {
  let { data, error } = await supabaseClient.from('services').select('*').order('sort_order');
  if (!error && (!data || data.length === 0)) {
    // First time — seed the table with defaults
    await supabaseClient.from('services').insert(defaultServices);
    const res = await supabaseClient.from('services').select('*').order('sort_order');
    data = res.data;
  }
  return data || [];
}

async function renderServices() {
  const services = await loadServices();
  const list = document.getElementById('servicesList');
  list.innerHTML = '';
  services.forEach((s) => {
    const item = document.createElement('div');
    item.className = 'service-item';
    item.innerHTML = `
      <div class="service-item-head" onclick="this.parentElement.classList.toggle('open')">
        <div class="service-icon-box">${s.icon}</div>
        <h4>${s.title}</h4>
        <span class="chevron">›</span>
      </div>
      <div class="service-body">
        <div class="form-group"><label>Icon (emoji)</label><input type="text" id="icon-${s.id}" value="${s.icon}"></div>
        <div class="form-group"><label>Title</label><input type="text" id="title-${s.id}" value="${s.title}"></div>
        <div class="form-group"><label>Short Description</label><textarea id="desc-${s.id}">${s.description}</textarea></div>
        <button class="save-btn" onclick="saveService('${s.id}')">Save</button>
        <span class="saved-msg" id="saved-${s.id}">✓ Saved</span>
      </div>
    `;
    list.appendChild(item);
  });
}

async function saveService(id) {
  const icon = document.getElementById(`icon-${id}`).value;
  const title = document.getElementById(`title-${id}`).value;
  const description = document.getElementById(`desc-${id}`).value;
  const { error } = await supabaseClient.from('services').update({ icon, title, description }).eq('id', id);
  if (error) { alert('Save failed: ' + error.message); return; }
  const msg = document.getElementById(`saved-${id}`);
  msg.style.display = 'inline';
  setTimeout(() => msg.style.display = 'none', 2000);
}

renderServices();
</script>
</body>
</html>
